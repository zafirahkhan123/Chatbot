<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | AI Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    background:white;
    padding:40px;
    width:360px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.container h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:gray;
    font-size:14px;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    font-size:14px;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.input-group input:focus{
    outline:none;
    border-color:#667eea;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#667eea;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

.login-btn:hover{
    background:#5563d1;
}

.register-link{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.register-link a{
    color:#667eea;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Welcome Back</h2>
<p class="subtitle">Login to access the AI Chatbot</p>

<form action="/login" method="POST">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button type="submit" class="login-btn">Login</button>

</form>

<div class="register-link">
Don't have an account? <a href="/register">Register</a>
</div>

</div>

</body>
</html>
